services:
  ctifeed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctifeed-radar
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      # SQLite veritabanini yerel ./data klasorunde kalici olarak sakla
      - ./data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/ctifeed.db
      - INTERVAL=15m
      - WORKERS=5
      - TIMEOUT=10s
      - MAX_AGE=168h
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
